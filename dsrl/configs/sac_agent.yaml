# DSRL-SAC agent (dsrl/sac_agent.py): hyperparameters only. Values below are the
# class defaults. Instantiation is partial because the networks, replay buffer and
# frozen diffusion policy are built at runtime:
#   make_agent = hydra.utils.instantiate(cfg)
#   agent = make_agent(actor=..., critic=[...], replay_buffer=..., wam=..., wandb_run=run)
# The agent only runs the WAM when acting: wam.generate(**wam_inputs, action_noise=..., decode_video=False).
# The latent actor's output_dim (and the critic's action_dim) is the number of steered
# noise dims: the diffusion policy's per-step action width, or only its active dims for
# unified-action checkpoints (active_dims / base_noise, from dsrl.models.wam_noise).
# The actor's noise is replicated over `horizon` steps.

_target_: dsrl.sac_agent.SACAgent
_partial_: true

horizon: ???                 # required: time steps of the diffusion policy's action noise
executed_steps: null         # actions executed per chunk (= one transition); null: the full horizon
gamma: 0.99                  # per-transition (= per executed chunk) discount, ~ gamma_step ** executed_steps
tau: 0.005                   # Polyak rate for the action-critic targets
batch_size: 256
gradient_steps: 20           # per environment timestep: N rounds of (critic step, actor + temperature step)
actor_lr: 3.0e-4
critic_lr: 3.0e-4
alpha_lr: 3.0e-4
init_alpha: 1.0              # initial SAC entropy coefficient
target_entropy: null         # null: -noise_dim
target_reduction: min        # how critic ensembles are reduced: min (clipped double-Q) or mean
target_update_interval: 1    # target Polyak update every N critic gradient steps
max_grad_norm: null          # null: no gradient clipping
device: cuda
# wandb: metrics are logged after every update(), each averaged over its gradient_steps.
