# Action critic Q^A(s, a) (dsrl/models/q_value.py), as in DSRL-NA: trained with
# TD learning on environment transitions, where `a` is the action chunk the
# frozen diffusion policy actually executed.
# Values below are the class defaults. Build it with hydra.utils.instantiate(cfg).

_target_: dsrl.models.q_value.QValue

input_dim: ???             # required: state/observation feature width
action_dim: ???            # required: width of the (flattened) executed action chunk
num_layers: 3              # number of hidden layers
hidden_dim: 2048           # width of every hidden layer
activation:                # hidden activation, passed as a class (default torch.nn.Tanh)
  _target_: hydra.utils.get_class
  path: torch.nn.Tanh
layer_norm: true           # LayerNorm after each hidden Linear, before the activation
orthogonal_init: false     # true: orthogonal hidden layers (gain sqrt 2), output head gain 1
